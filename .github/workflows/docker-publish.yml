name: Build & Publish Docker Image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image name (lowercase)
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Set up QEMU (arm64)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # GHCR：公开镜像免费无限制、无不活跃删除政策；GITHUB_TOKEN 零配置
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha

      # main 每次提交都重建：latest 永远是最新代码（amd64 + arm64 双架构）
      # 先本地 build 单架构做启动冒烟测试，通过后才推正式多架构镜像——
      # "build 成功但容器起不来"（如 COPY 语义、import 错误）在这里拦住
      - name: Build for smoke test (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: kindledashboard:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (start container + /ping)
        run: |
          docker run -d --name smoke -p 41241:41241 -e KD_PASSWORD=citest kindledashboard:smoke
          code=""
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:41241/ping || true)
            [ "$code" = "204" ] && break
            sleep 2
          done
          if [ "$code" != "204" ]; then
            echo "=== container failed to serve /ping, logs: ==="
            docker logs smoke
            exit 1
          fi
          echo "smoke test OK (/ping -> 204)"
          docker rm -f smoke

      - name: Build & push (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
