services:
  kindle-dashboard:
    # 本地构建；想直接用 CI 产物可改为：
    # image: ghcr.io/zevalain/kindledashboard:latest
    build: .
    container_name: kindle-dashboard
    restart: unless-stopped
    ports:
      - "41241:41241"
    volumes:
      - ./data:/data        # 配置、待办、缓存、密钥全在这里，备份这个目录即可
    environment:
      - KD_PASSWORD=change-me   # 建议改成自己的密码；不设则首次启动自动生成（见容器日志）
      # - TZ=Asia/Shanghai      # 服务端时间固定用东八区计算，此项仅影响容器内日志时间
