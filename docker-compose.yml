services:
  kindle-dashboard:
    image: ghcr.io/zevalain/kindledashboard:latest
    container_name: kindle-dashboard
    restart: unless-stopped
    ports:
      - "41241:41241"
    volumes:
      - kindle-data:/data
    environment:
      - TZ=Asia/Shanghai
      - KD_PASSWORD=change-me
      - KD_DISPLAY_KEY=change-me-too

volumes:
  kindle-data:
    name: kindle-data
