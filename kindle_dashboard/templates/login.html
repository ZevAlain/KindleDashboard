<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>系统登录</title>
    <style>
        body { font-family: sans-serif; padding: 30px 20px; max-width: 400px; margin: 0 auto; background: #f4f4f9; text-align: center; }
        .card { background: white; padding: 25px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h2 { margin-top: 0; color: #333; }
        input[type="password"] { width: 100%; padding: 12px; margin-top: 15px; box-sizing: border-box; font-size: 18px; border: 1px solid #ccc; border-radius: 4px; text-align: center; }
        button { width: 100%; padding: 12px; background: #007bff; color: white; border: none; font-size: 18px; margin-top: 20px; border-radius: 4px; cursor: pointer; }
        .error { color: red; margin-top: 10px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>备忘录系统登录</h2>
        {% if error %}<div class="error">{{ error }}</div>{% endif %}
        <form action="/login" method="post">
            <input type="password" name="password" placeholder="请输入密码" autofocus required>
            <button type="submit">登 录</button>
        </form>
    </div>
</body>
</html>
